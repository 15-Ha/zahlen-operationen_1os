/* Generischer Listen-PDF: nummerierte Aufgaben + Lösungsteil.
   Paginiert (Bin-Packing) statt die Schrift zu verkleinern, damit alles auf
   eine Seite passt – dadurch bleibt die Schrift lesbar und der verfügbare
   Platz pro Seite wird ausgenutzt statt leer zu bleiben. */
// Verteilt Einträge variabler Höhe gleichmässig über die minimal nötige Seitenzahl,
// statt sie gierig auf die erste Seite zu packen (verhindert fast leere Restseiten).
function packBalanced(entries,firstAvail,contAvail,buffer){
  function greedyCount(){
    let cnt=1,curH=0,avail=firstAvail;
    for(const e of entries){
      if(curH>0 && curH+e.h+buffer>avail){ cnt++; curH=0; avail=contAvail; }
      curH+=e.h;
    }
    return cnt;
  }
  const pages=Math.max(1,greedyCount());
  const avails=Array.from({length:pages},(_,i)=>i===0?firstAvail:contAvail);
  const totalAvail=avails.reduce((a,b)=>a+b,0);
  const totalH=entries.reduce((s,e)=>s+e.h,0);
  const fillRatio=totalAvail>0?Math.min(1,totalH/totalAvail):1;
  const targets=avails.map(a=>a*fillRatio);
  const result=[]; let pi=0,curH=0,cur=[];
  entries.forEach(e=>{
    const willOverflow=cur.length&&(curH+e.h+buffer>avails[pi]);
    const reachedTarget=cur.length&&curH>=targets[pi]&&pi<pages-1;
    if(willOverflow||reachedTarget){
      result.push({entries:cur,avail:avails[pi]});
      pi=Math.min(pi+1,avails.length-1); cur=[]; curH=0;
    }
    cur.push(e); curH+=e.h;
  });
  if(cur.length) result.push({entries:cur,avail:avails[pi]});
  return result;
}

function buildDarstellPlusPDF(tasks,serie){

  packBalanced(sEntries,BOTTOM-y,BOTTOM-(M+6),3).forEach((pg,pi)=>{

      y+=e.h+extra;});
  });

    '<p style="color:var(--ink-soft);margin:0 0 16px;max-width:70ch"><b>Grundanforderungen</b> = Basis, <b>Erweitert</b> = darauf aufbauend, <b>Anspruchsvoll</b> = Niveau Kanti/BMS/WMS/FMS.</p>'+
    '<h3 style="font-family:var(--serif);margin:.3em 0 .2em;font-size:22px">Lernstandsüberprüfung &amp; Lernkontrolle</h3>'+
    '<p style="color:var(--ink-soft);margin:0;max-width:70ch">Gleiche Aufgabenserie, unterschiedlicher Zeitpunkt: <b>Lernstandsüberprüfung</b> vor dem Üben zeigt, was noch fehlt. <b>Lernkontrolle</b> nach dem Üben prüft, ob alles sitzt. Auf der Startseite deckt die Lernkontrolle alle Themen zusammen ab.</p></div>'+
  '</section>';
}

function fr(n,d){return fracH(n,d);}
const THEORIE={
 bruchbasis:()=>'<h4>Aufbau eines Bruches</h4><p>Ein <b>Bruch</b> beschreibt Teile eines Ganzen. Oben steht der <b>Zähler</b> (wie viele Teile genommen werden), unten der <b>Nenner</b> (in wie viele gleiche Teile das Ganze geteilt ist). Dazwischen liegt der <b>Bruchstrich</b>.</p><div class="bsp"><span class="lbl">Beispiel</span>'+fr(3,4)+' → Zähler 3, Bruchstrich, Nenner 4</div><h4>Der Bruchstrich ist ein Divisionszeichen</h4><p>Jeder Bruch ist eine <b>Division</b>: Der Zähler wird durch den Nenner geteilt.</p><div class="bsp">'+fr(3,4)+' = 3 : 4 = 0.75</div><h4>Stammbrüche</h4><p><b>Stammbrüche</b> haben immer den Zähler 1.</p><table class="tbl"><thead><tr><th>Stammbruch</th><th>Dezimalwert</th><th>Stammbruch</th><th>Dezimalwert</th></tr></thead><tbody><tr><td>'+fr(1,2)+'</td><td>0.5</td><td>'+fr(1,6)+'</td><td>0.1666…</td></tr><tr><td>'+fr(1,3)+'</td><td>0.333…</td><td>'+fr(1,8)+'</td><td>0.125</td></tr><tr><td>'+fr(1,4)+'</td><td>0.25</td><td>'+fr(1,9)+'</td><td>0.111…</td></tr><tr><td>'+fr(1,5)+'</td><td>0.2</td><td>'+fr(1,10)+'</td><td>0.1</td></tr></tbody></table><div class="merke"><b>Merke:</b> Je <b>grösser</b> der Nenner, desto <b>kleiner</b> der Bruchteil. Sind Zähler und Nenner gleich, ergibt der Bruch genau 1 Ganzes: '+fr(5,5)+' = 1.</div>',
 modelle:()=>'<p>Ein <b>Bruch</b> beschreibt Teile eines Ganzen. Der <b>Nenner</b> (unten) sagt, in wie viele gleiche Teile das Ganze geteilt ist, der <b>Zähler</b> (oben), wie viele Teile genommen (gefärbt) sind.</p><p>Denselben Anteil kann man in verschiedenen Modellen zeigen: <b>Kreismodell</b>, <b>Flächenmodell</b> (Rechteck), <b>Streckenmodell</b> (Zahlenstrahl 0–1), Bruchstreifen oder als 100 Felder (Prozent).</p><div class="illu" data-draw="fracmodels:3:4"></div><div class="bsp"><span class="lbl">Beispiel</span>3 von 4 Feldern gefärbt → '+fr(3,4)+' = 0.75 = 75 %</div><div class="merke"><b>Wichtig:</b> Das Ganze muss immer in <b>gleich grosse</b> Teile geteilt sein – sonst lässt sich der Anteil nicht als Bruch ablesen.</div>',
 darstell:()=>'<p>Derselbe Anteil kann als <b>Bruch</b>, als <b>Dezimalzahl</b> und als <b>Prozentzahl</b> geschrieben werden. «Prozent» heisst «pro Hundert».</p><table class="tbl"><thead><tr><th>Bruch</th><th>Dezimalzahl</th><th>Prozent</th></tr></thead><tbody><tr><td>'+fr(1,2)+'</td><td>0.5</td><td>50 %</td></tr><tr><td>'+fr(1,4)+'</td><td>0.25</td><td>25 %</td></tr><tr><td>'+fr(3,4)+'</td><td>0.75</td><td>75 %</td></tr><tr><td>'+fr(1,5)+'</td><td>0.2</td><td>20 %</td></tr><tr><td>'+fr(1,8)+'</td><td>0.125</td><td>12.5 %</td></tr></tbody></table><h4>So wandelt man um</h4><ul><li><b>Bruch → Dezimalzahl:</b> Zähler durch Nenner teilen (3 : 4 = 0.75).</li><li><b>Dezimalzahl → Prozent:</b> mit 100 multiplizieren (0.75 · 100 % = 75 %).</li><li><b>Prozent → Dezimalzahl:</b> durch 100 teilen (80 % = 0.8).</li><li><b>Dezimalzahl → Bruch:</b> als Dezimalbruch schreiben und kürzen (0.75 = '+fr(75,100)+' = '+fr(3,4)+').</li></ul><div class="bsp"><span class="lbl">Anteil aus einer Umfrage</span>16 von 20 Lernenden = '+fr(16,20)+' = '+fr(4,5)+' = 0.8 = 80 %</div>',
 tabelle:()=>'<p>Jeder Anteil lässt sich auf mehrere Arten darstellen: als <b>Bruch</b>, im <b>Modell</b> (z. B. Kreis- oder Streckenmodell), als <b>Prozentzahl</b>, als <b>Dezimalzahl</b> – und bei Hohlmassen zusätzlich als <b>Liter, Zentiliter oder Milliliter</b>.</p><table class="tbl"><thead><tr><th>Bruch</th><th>Prozent</th><th>Dezimalzahl</th><th>l = cl = ml</th></tr></thead><tbody><tr><td>'+fr(1,2)+'</td><td>50 %</td><td>0.5</td><td>0.5 l = 50 cl = 500 ml</td></tr><tr><td>'+fr(1,4)+'</td><td>25 %</td><td>0.25</td><td>0.25 l = 25 cl = 250 ml</td></tr><tr><td>'+fr(1,10)+'</td><td>10 %</td><td>0.1</td><td>0.1 l = 10 cl = 100 ml</td></tr><tr><td>'+fr(1,100)+'</td><td>1 %</td><td>0.01</td><td>0.01 l = 1 cl = 10 ml</td></tr></tbody></table><div class="merke"><b>Merke (Hohlmass):</b> 1 l = 100 cl = 1000 ml. Darum: cl-Wert = Dezimalzahl · 100, ml-Wert = Dezimalzahl · 1000.</div><div class="bsp"><span class="lbl">Beispiel</span>'+fr(3,4)+' l = 0.75 l = 75 cl = 750 ml</div>',
 bruchbild:()=>'<p>Im <b>Bruchbild</b> ist das Ganze ein Gitter aus <b>12 · 12 = 144 Häuschen</b>. Jede farbige Fläche ist ein Bruchteil davon.</p><div class="merke"><b>Vorgehen:</b> 1. Häuschen der Fläche auszählen (Rechteck: Länge · Breite; halbes Rechteck: Länge · Breite : 2). 2. Anzahl über 144 schreiben. 3. Vollständig kürzen.</div><div class="illu" data-draw="bild144"></div><div class="bsp"><span class="lbl">Beispiel</span>4 · 4 = 16 Häuschen → '+fr(16,144)+' = '+fr(1,9)+'</div>',
 kuerzen:()=>'<h4>Erweitern</h4><p>Zähler und Nenner eines Bruches werden mit derselben <b>Erweiterungszahl</b> multipliziert.</p><div class="bsp"><span class="lbl">erweitern mit 2</span>'+fr(1,3)+' = '+fr(2,6)+'</div><h4>Kürzen</h4><p>Zähler und Nenner eines Bruches werden durch dieselbe <b>Kürzungszahl</b> dividiert.</p><div class="bsp"><span class="lbl">kürzen mit 2</span>'+fr(4,6)+' = '+fr(2,3)+'</div><div class="illu" data-draw="rects2:3:4:6:8"></div><p>Beim Erweitern und Kürzen <b>ändert sich der Wert des Bruches nicht</b> – nur die Schreibweise. Zum vollständigen Kürzen nimmt man als Kürzungszahl den <b>ggT</b> von Zähler und Nenner.</p><div class="bsp"><span class="lbl">vollständig kürzen (ggT = 6)</span>'+fr(18,24)+' = '+fr(3,4)+'</div><div class="merke"><b>Merke:</b> Vollständig gekürzt ist ein Bruch, wenn Zähler und Nenner keinen gemeinsamen Teiler mehr haben (ggT = 1).</div>',
 vonrechnen:()=>'<div class="merke"><b>Merke:</b> «von» bedeutet «mal» (·).</div><h4>Bruchteil einer Zahl</h4><p>Zwei Schritte: durch den <b>Nenner</b> dividieren, dann mit dem <b>Zähler</b> multiplizieren.</p><div class="bsp"><span class="lbl">Beispiel</span>'+fr(4,5)+' von 40 = 40 : 5 · 4 = 8 · 4 = 32</div><h4>Bruchteil eines Bruches</h4><p>Zähler mal Zähler, Nenner mal Nenner.</p><div class="bsp">'+fr(3,7)+' von '+fr(1,4)+' = '+fr(3,7)+' · '+fr(1,4)+' = '+fr(3,28)+'</div><h4>Prozent von einer Zahl</h4><p>Prozentzahl zuerst als Dezimalzahl schreiben, dann multiplizieren.</p><div class="bsp">20 % von 60 = 0.2 · 60 = 12</div>',
 bruchrechnen:()=>'<h4>Addition und Subtraktion</h4><p>Drei Schritte:</p><ul><li>1. Brüche <b>gleichnamig</b> machen (erweitern auf den gemeinsamen Nenner = kgV).</li><li>2. Zähler addieren bzw. subtrahieren, <b>Nenner beibehalten</b>.</li><li>3. Ergebnis kürzen.</li></ul><div class="bsp">'+fr(1,2)+' + '+fr(1,6)+' = '+fr(3,6)+' + '+fr(1,6)+' = '+fr(4,6)+' = '+fr(2,3)+'</div><h4>Multiplikation</h4><p>Zähler mal Zähler, Nenner mal Nenner. <b>Hinweis:</b> übers Kreuz kürzen nicht vergessen!</p><div class="bsp">'+fr(2,3)+' · '+fr(3,4)+' = '+fr(6,12)+' = '+fr(1,2)+'</div><h4>Division</h4><p>Division heisst <b>Messen</b>: Wie oft passt der zweite Bruch in den ersten hinein?</p><div class="bsp">'+fr(3,4)+' : '+fr(1,4)+' = 3 &nbsp;(drei Viertel passen dreimal hinein)</div><p>Gerechnet wird in zwei Schritten: 1. den <b>Kehrwert des Divisors</b> nehmen (Zähler und Nenner tauschen), 2. die Brüche <b>multiplizieren</b>.</p><div class="bsp">'+fr(3,4)+' : '+fr(3,8)+' = '+fr(3,4)+' · '+fr(8,3)+' = '+fr(24,12)+' = 2</div><div class="merke"><b>Ganze Zahlen</b> zuerst als Bruch schreiben: 5 = '+fr(5,1)+'. Probe für den Kehrwert: Bruch · Kehrwert = 1.</div><h4>Typische Fehler</h4><ul><li>Beim Dividieren wird der <b>falsche</b> Bruch umgekehrt – umgekehrt wird nur der <b>zweite</b> Bruch (der Divisor).</li><li>Das Rechenzeichen wird nicht gewechselt – aus «:» wird «·».</li><li>Das Ergebnis wird nicht gekürzt.</li></ul>',
 potschreib:()=>'<p>Eine <b>Potenz</b> ist die Kurzschreibweise für ein Produkt aus lauter gleichen Faktoren.</p><div class="bsp">2 · 2 · 2 · 2 · 2 = 2<sup>5</sup></div><p>Dabei ist die <b>Basis</b> der Faktor (hier 2) und der <b>Exponent</b> (hier 5) die Anzahl der Faktoren.</p>',
 potberech:()=>'<p>Den <b>Wert</b> einer Potenz berechnet man, indem man die Basis so oft mit sich selbst multipliziert, wie der Exponent angibt.</p><div class="bsp">2<sup>5</sup> = 2·2·2·2·2 = 32 &nbsp;&nbsp; 5<sup>2</sup> = 25 &nbsp;&nbsp; 4<sup>3</sup> = 64</div><p>b<sup>2</sup> heisst „quadriert", b<sup>3</sup> „hoch drei" (Kubik).</p>',
 baum:()=>'<p>Ein <b>Baumdiagramm</b> zeigt schrittweise alle Möglichkeiten. Auf jeder Stufe verzweigt es sich in die zur Auswahl stehenden Möglichkeiten.</p><div class="merke"><b>Zählprinzip:</b> Die Gesamtzahl aller Möglichkeiten ist das <b>Produkt</b> der Astzahlen der einzelnen Stufen.</div><div class="bsp"><span class="lbl">Beispiel</span>2 Vorspeisen · 3 Hauptgänge · 2 Desserts = 2·3·2 = 12 Menüs</div><div class="illu" data-draw="tree"></div>',
 zehner:()=>'<p>Eine <b>Zehnerpotenz</b> ist eine Potenz mit Basis 10: 10<sup>n</sup> ist eine 1 mit n Nullen.</p><div class="bsp">10<sup>1</sup>=10 &nbsp; 10<sup>2</sup>=100 &nbsp; 10<sup>3</sup>=1000 &nbsp; 10<sup>6</sup>=1’000’000</div><p>Grosse Zahlen schreibt man kurz als <b>Vielfaches</b> einer Zehnerpotenz:</p><div class="bsp">4000 = 4 · 10<sup>3</sup> &nbsp;&nbsp; 70’000 = 7 · 10<sup>4</sup></div>',
 gesetze:()=>'<h4>Kommutativgesetz (Vertauschungsgesetz)</h4><p>Die Reihenfolge der Zahlen darf vertauscht werden – bei Addition und Multiplikation.</p><div class="bsp">a + b = b + a &nbsp;&nbsp; a · b = b · a</div><h4>Assoziativgesetz (Verbindungsgesetz)</h4><p>Die Klammern (Gruppierung) dürfen verschoben werden.</p><div class="bsp">(a + b) + c = a + (b + c) &nbsp;&nbsp; (a · b) · c = a · (b · c)</div><div class="merke"><b>Nutzen:</b> Mit diesen Gesetzen kann man geschickter und einfacher rechnen (z. B. zuerst zu 10 ergänzen).</div>',
 kgvggt:()=>'<p>Der <b>ggT</b> (grösster gemeinsamer Teiler) ist die grösste Zahl, die beide Zahlen teilt – man braucht ihn zum <b>Kürzen</b>.</p><p>Das <b>kgV</b> (kleinstes gemeinsames Vielfaches) ist die kleinste Zahl, die Vielfaches beider Zahlen ist – man braucht es als <b>gemeinsamen Nenner</b>.</p><div class="bsp"><span class="lbl">über Primfaktoren</span>12 = 2<sup>2</sup> · 3 &nbsp; 18 = 2 · 3<sup>2</sup><br>ggT = 2 · 3 = 6 &nbsp;&nbsp; kgV = 2<sup>2</sup> · 3<sup>2</sup> = 36</div>',
 groedez:()=>'<p>Einen <b>Bruchteil einer Grösse</b> berechnet man, indem man den Bruch mit der Grösse multipliziert.</p><div class="bsp">'+fr(3,4)+' kg = '+fr(3,4)+' von 1000 g = 750 g</div><p><b>Bruch ↔ Dezimalzahl:</b> Den Bruch als Division lesen bzw. die Dezimalzahl als Bruch schreiben und kürzen.</p><div class="bsp">'+fr(3,4)+' = 0.75 &nbsp;&nbsp; 0.2 = '+fr(1,5)+'</div>',
 zstrahl:()=>'<p>Auf dem <b>Zahlenstrahl</b> gilt: je weiter <b>rechts</b>, desto <b>grösser</b> die Zahl.</p><div class="merke"><b>Vergleichen:</b> Zuerst die Stellen nach dem Komma gleich lang auffüllen, dann Ziffer für Ziffer vergleichen. So ist 0.7 = 0.70, also 0.70 &gt; 0.68.</div><div class="bsp"><span class="lbl">Aufsteigend ordnen</span>0.38 &lt; 0.4 &lt; 0.409 &lt; 0.5</div><div class="illu" data-draw="numberline"></div>',
 stellenwert:()=>'<p>In der <b>Stellenwerttafel</b> hat jede Stelle einen festen Wert. Nach links wird jede Stelle zehnmal grösser, nach rechts zehnmal kleiner.</p><div class="bsp"><span class="lbl">Stellen</span>H&nbsp;Z&nbsp;E , z&nbsp;h&nbsp;t &nbsp;=&nbsp; Hunderter, Zehner, Einer , Zehntel, Hundertstel, Tausendstel</div><div class="bsp"><span class="lbl">Beispiel</span>3.47 = 3 Einer, 4 Zehntel, 7 Hundertstel</div><div class="illu" data-draw="pvt:3.47"></div>',
 dezrechnen:()=>'<h4>Addieren & Subtrahieren</h4><p>Die <b>Kommas</b> genau untereinander schreiben (gleiche Stellen unter gleiche Stellen; bei Bedarf mit Nullen auffüllen), dann wie gewohnt spaltenweise rechnen.</p><div class="bsp">2.50 + 1.30 = 3.80</div><h4>Multiplizieren</h4><p>Drei Schritte: 1. Ohne Komma rechnen (wie ganze Zahlen). 2. Die Nachkommastellen beider Faktoren zusammenzählen. 3. Im Ergebnis so viele Nachkommastellen abzählen und das Komma setzen.</p><div class="bsp">0.3 · 0.4 = 3 · 4 = 12 &nbsp;→&nbsp; 1 + 1 = 2 Nachkommastellen &nbsp;→&nbsp; 0.12</div><h4>Dividieren</h4><p>Das Komma beim Divisor so verschieben, dass er eine ganze Zahl wird – das Komma beim Dividenden um gleich viele Stellen mitverschieben. Dann wie gewohnt dividieren.</p><div class="bsp">6.4 : 0.8 = 64 : 8 = 8</div><div class="merke"><b>Merke:</b> Bei + und − müssen die Kommas übereinander stehen. Bei · und : wird zuerst ohne Komma gerechnet – das Komma kommt erst am Schluss.</div>'
};

function mk2(w,h){const c=document.createElement('canvas');const dpr=2;c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px';const ctx=c.getContext('2d');ctx.scale(dpr,dpr);return {c,ctx};}
function illuItem(canvas,cap){const d=document.createElement('div');d.className='illu-item';d.appendChild(canvas);if(cap){const c=document.createElement('div');c.className='illu-cap';c.textContent=cap;d.appendChild(c);}return d;}
function renderIllus(root){(root||document).querySelectorAll('.illu[data-draw]').forEach(function(el){
  if(el.dataset.done)return;el.dataset.done='1';var p=el.dataset.draw.split(':'),kind=p[0];
  if(kind==='fracmodels'){var n=+p[1],d=+p[2];el.classList.add('illu-row');['circle','rect','line','percent'].forEach(function(k){var mk=makeCanvas(104);drawFractionModel(mk.ctx,104,k,n,d);el.appendChild(illuItem(mk.c,MODELN[k]));});}
  else if(kind==='rects2'){el.classList.add('illu-row');[[+p[1],+p[2]],[+p[3],+p[4]]].forEach(function(a){var mk=makeCanvas(120);drawFractionModel(mk.ctx,120,'rect',a[0],a[1]);el.appendChild(illuItem(mk.c,a[0]+'/'+a[1]));});}
  else if(kind==='bild144'){var mk=makeCanvas(268);
    drawBruchbild(mk.ctx,268,[{x:1,y:1,w:4,h:4,tri:0,letter:'A'},{x:7,y:8,w:4,h:3,tri:0,letter:'B'},{x:7,y:1,w:4,h:3,tri:1,letter:'C'}]);
    el.appendChild(illuItem(mk.c,'A = 16/144 = 1/9 · B = 12/144 = 1/12 · C = 6/144 = 1/24'));}
  else if(kind==='tree'){var mk=mk2(300,180);drawTree(mk.ctx,300,[['Tee','Saft'],['A','B','C']],{h:180});el.appendChild(illuItem(mk.c,'2 · 3 = 6 Möglichkeiten'));}
  else if(kind==='numberline'){var mk=mk2(340,86);drawNumberLine(mk.ctx,340,0,1,0.1,[{v:0.7,label:'0.7',color:'#d5473e'}],{h:86});el.appendChild(mk.c);}
  else if(kind==='pvt'){var num=parseFloat(p[1]);var mk=mk2(360,132);drawPVT(mk.ctx,360,pvtDigits(num,2));el.appendChild(illuItem(mk.c,'dargestellt: '+fmtCH(num)));}
});}

  $$('[data-view]').forEach(b=>b.addEventListener('click',()=>showView(b.dataset.view)));

  $$('[data-lkscope]').forEach(b=>b.addEventListener('click',()=>goToLK(b.dataset.lkscope)));
  $$('.nav-chevron').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();toggleNavGroup(b.dataset.toggle);}));
  $('#menuToggle').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));
  wireTabs();
  TOPICS.forEach(t=>{mountPractice($('#'+t.key+'-uebn'),t.gen,{selector:t.selector,title:t.title});mountGenerator($('#'+t.key+'-gen'),t);});
  mountLKView();
  renderIllus();
}
if(!(window.LVHOOK&&window.LVHOOK.blockInit()))init();
</script>
</body>
</html>
